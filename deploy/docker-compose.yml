# Minimal self-hosted OpenConsole relay.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# This exposes plain HTTP on 8080. That is fine on a private network or behind
# a reverse proxy that terminates TLS; do not expose it directly to the
# internet. Session tokens are bearer credentials and travel in the clear
# without TLS. See deploy/README.md.

services:
  relay:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${OPENCONSOLE_VERSION:-dev}
    image: openconsole-server:${OPENCONSOLE_VERSION:-dev}
    restart: unless-stopped

    ports:
      - "${OPENCONSOLE_PORT:-8080}:8080"
      # SSH joins: `ssh <session>@host -p 2222`. Map to 22 on a host that has
      # nothing else there.
      - "${OPENCONSOLE_SSH_PORT:-2222}:2222"

    environment:
      OPENCONSOLE_LISTEN_ADDR: ":8080"
      OPENCONSOLE_SESSION_TTL: "${OPENCONSOLE_SESSION_TTL:-30m}"
      OPENCONSOLE_LOG_LEVEL: "${OPENCONSOLE_LOG_LEVEL:-info}"
      # SSH is opt-in; this is the opt-in. Remove both of these to run
      # WebSocket-only.
      OPENCONSOLE_SSH_ADDR: ":2222"
      # The host key must outlive the container. Without it every restart
      # greets returning guests with the host-key-changed warning that normally
      # means an active attack.
      OPENCONSOLE_SSH_HOST_KEY: "/var/lib/openconsole/ssh_host_key"
      # Where guests should ssh to, when that is not the name they reached the
      # API on. An HTTP proxy in front carries HTTP and not arbitrary TCP
      # ports, so ssh usually needs a name of its own pointed straight here.
      # Leave unset when both arrive at the same place.
      # OPENCONSOLE_SSH_HOST: "ssh.example.com:22"

    volumes:
      # The only state the relay keeps on disk. Sessions stay in memory.
      - openconsole-state:/var/lib/openconsole

    # The relay keeps sessions in memory; the SSH host key is the one thing it
    # writes, and that lives on the named volume above. Everything else can be
    # read-only with every privilege dropped.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    # A session is a goroutine and a scrollback buffer, not much else. The cap
    # is here so an unauthenticated session-creation flood degrades this
    # container rather than the host.
    mem_limit: 256m
    pids_limit: 512

    # Graceful shutdown drains in-flight requests and closes tunnels with a
    # CLOSE frame; give it more than Docker's default 10s.
    stop_grace_period: 20s

    healthcheck:
      test: ["CMD", "/openconsole-server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  openconsole-state:
