name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The race detector is not optional here: the relay is a fan-in point and
      # most of its interesting logic is concurrent.
      - name: go test -race
        run: go test -race ./...

      - name: cross-compile
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=arm64 go build ./...

  windows:
    name: Windows client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # The pseudo-console is the part of this that can only be tested on a
      # real Windows: cross-compiling proves it builds, not that a shell ever
      # starts on it. The race detector is left to the Linux job, which runs
      # the same concurrent code with a C toolchain it can rely on.
      #
      # Two forwarding tests are excluded, and neither is a Windows problem.
      # Both stall intermittently: TestForwardClosePropagates loses a CLOSE the
      # writer had already queued, and the slow-reader test has stopped short
      # of the end of a 4MB stream — while passing in a second on the same
      # runner the run before, and in 0.06s on a laptop. The cause is a race in
      # the forward path that this job is only better at provoking; it is being
      # fixed separately, and these come back when it is.
      - name: go test
        run: >
          go test
          -skip 'TestForwardClosePropagates|TestForwardEndToEndSlowReaderDoesNotResetTheStream'
          ./...

      # install.ps1 is only ever run by someone piping it into PowerShell, so
      # a syntax error in it would first be found by a user. Parsing it here
      # is the cheapest possible substitute for that.
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path web/public/install.ps1).Path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host $_ }
            exit 1
          }

  web:
    name: Browser client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # Covers the test files too, which the production build deliberately
      # does not: one of them imports a fixture shared with internal/e2e, and
      # that only resolves where the whole repository is present.
      - run: npm run typecheck
        working-directory: web

      - run: npm run test
        working-directory: web

      # internal/webui/dist is generated but committed, so `go build` works
      # without Node. That only holds if somebody remembers to rebuild it —
      # this is the check that they did.
      - name: the committed bundle matches the sources
        run: |
          npm --prefix web run build
          if ! git diff --quiet -- internal/webui/dist; then
            echo "internal/webui/dist is stale. Run: npm --prefix web run build"
            git diff --stat -- internal/webui/dist
            exit 1
          fi

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build only: pushing images is a release concern, and a PR should not
      # need registry credentials.
      - run: docker build -t openconsole-server:ci .
