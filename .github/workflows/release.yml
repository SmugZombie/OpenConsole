name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The client is the only thing published here. The relay ships as a
      # container image; the binary people need to download is the one they
      # run on their own machine.
      - name: Build client binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            echo "building openconsole for $os/$arch"
            # Windows programs need the .exe suffix to be runnable, and
            # install.ps1 looks for that name inside the archive.
            exe=""
            if [ "$os" = windows ]; then exe=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/openconsole${exe}" ./cmd/openconsole
            # The installers expect openconsole_<os>_<arch> holding a bare
            # `openconsole`: a .tar.gz for Unix, a .zip for Windows, because
            # that is what each platform can unpack without help. Keep the
            # names in step with install.sh and install.ps1.
            # LICENSE rides along: MIT asks for the notice to be included with
            # copies, and a release archive is a copy. The installers take the
            # bare binary and ignore anything else in the archive.
            cp LICENSE dist/LICENSE
            if [ "$os" = windows ]; then
              (cd dist && zip -q "openconsole_${os}_${arch}.zip" openconsole.exe LICENSE)
            else
              tar -czf "dist/openconsole_${os}_${arch}.tar.gz" -C dist openconsole LICENSE
            fi
            rm "dist/openconsole${exe}" dist/LICENSE
          done
          cd dist && sha256sum *.tar.gz *.zip > checksums.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
